<!doctype html>
<html lang="en" data-theme="dark" data-color="purple">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logos/lastweek_main_logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="LastWeek - AI-powered study platform with 5 learning modes. Master any subject in one week with smart PDF processing and spaced repetition." />
    <meta name="keywords" content="study app, AI learning, exam prep, flashcards, spaced repetition, PDF study tool" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>LastWeek - Master Any Subject in One Week</title>
    <!-- Apply saved color theme before React loads to prevent flash -->
    <script>
      (function() {
        var validColors = ['purple', 'orange', 'green', 'brown', 'blue'];
        var saved = localStorage.getItem('lastweek-color');
        var color = (saved && validColors.indexOf(saved) !== -1) ? saved : 'purple';
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-color', color);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
